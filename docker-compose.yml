services:
  postgres:
    image: postgres:16-alpine
    container_name: sig-gestao-ti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sig_gestao_ti
    ports:
      # Host 5432 evita conflito com outro Postgres na 5432 (WSL/Windows/DBeaver).
      - "5432:5432"
    volumes:
      - sig_gestao_ti_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sig_gestao_ti"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sig_gestao_ti_pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: sig-heartbeat-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sig_heartbeat_hub
    ports:
      # Host 5433 evita conflito com outro Postgres na 5432 (WSL/Windows/DBeaver).
      - "5433:5432"
    volumes:
      - sig_heartbeat_hub_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sig_heartbeat_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sig_heartbeat_hub_pgdata:

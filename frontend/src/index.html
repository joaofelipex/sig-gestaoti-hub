<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SIG Gestão TI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#023ED8">
  <link rel="icon" type="image/png" href="icon-imts.png">
  <style>
    .sig-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 0;
      background: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .sig-boot__logo {
      width: auto;
      height: 56px;
      max-width: min(220px, 70vw);
      object-fit: contain;
      animation: sig-boot-pulse 1.4s ease-in-out infinite;
    }
    .sig-boot__spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid rgba(2, 62, 216, 0.15);
      border-top-color: #023ED8;
      border-radius: 50%;
      animation: sig-boot-spin 0.75s linear infinite;
    }
    .sig-boot__sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes sig-boot-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes sig-boot-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sig-boot__logo,
      .sig-boot__spinner {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="sig-boot" role="status" aria-live="polite">
      <img class="sig-boot__logo" src="icon-imts.png" alt="IMTS" />
      <div class="sig-boot__spinner" aria-hidden="true"></div>
      <span class="sig-boot__sr">A carregar…</span>
    </div>
  </app-root>
  <noscript>
    <p style="padding:2rem;font-family:system-ui,sans-serif">
      JavaScript é necessário. Abra <a href="/auth">/auth</a> no Firefox ou Chrome.
    </p>
  </noscript>
</body>
</html>
